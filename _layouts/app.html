---
layout: default
---

<!-- app.html - Layout khusus untuk halaman aplikasi -->
<div class="app-content fade-in">
    {{ content }}
</div>

<!-- Empty state container (will be used by JS) -->
<div id="empty-state" style="display: none;" class="text-center py-5">
    <i class="bi bi-inbox fs-1 text-muted"></i>
    <p class="mt-2 text-muted fw-bold">Belum ada data</p>
</div>

<!-- Loading spinner -->
<div id="loading-spinner" style="display: none;" class="text-center py-5">
    <div class="spinner mx-auto"></div>
    <p class="mt-2 text-muted small">Memuat...</p>
</div>

<style>
.app-content {
    min-height: 50vh;
}
</style>
